# Which trailer an agent-assisted commit carries.
# Resolution rules and the default wording of each convention:
# docs/setup/commit-attribution.md.
#
# In .apache-magpie-overrides/ (committed) this is the project's policy,
# and it wins. In the personal layer (.apache-magpie-local/ when the
# project adopted Magpie, <git-common-dir>/apache-magpie/ otherwise) it is
# one contributor's preference, used only when the project's file is absent
# or says contributor-choice.

# generated-by | assisted-by | co-authored-by | none | custom
# The project's file may also say contributor-choice.
convention = "generated-by"

# Optional; required when convention = "custom".
# Placeholders: {agent}, {model}, {email}.
# template = "Generated-by: {agent} ({model})"
