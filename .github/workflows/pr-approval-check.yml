#
# Enforces the PR policy (docs/community/pr-policy-and-review-guidelines.md):
# a pull request needs at least one approving review from a committer before
# it can be merged, unless it was opened by a PMC member
# (.github/pmc-members.txt). The "Committer approval" job is a required status
# check on main via .asf.yaml, mirroring Airflow's
# required_approving_review_count: 1 but with the PMC exemption.
#
name: PR Approval Check

on:
  # Runs with the base repository's workflow definition, also for fork PRs.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  # Re-evaluate whenever a review is submitted, edited or dismissed.
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-approval-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  committer-approval:
    # This job name is the status check context referenced in .asf.yaml.
    name: Committer approval
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Always take the script and the PMC list from the base branch so a PR
      # cannot change the rule it is being checked against. No code from the
      # PR head is executed.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
          sparse-checkout: |
            .github/pmc-members.txt
            .github/scripts/check_pr_approval.py
          sparse-checkout-cone-mode: false

      - name: Check for a committer approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/check_pr_approval.py
